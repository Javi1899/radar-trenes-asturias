<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radar Ferroviario de Asturias</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #estado {
            background: white;
            padding: 9px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            font-size: 12px;
            font-weight: bold;
            color: #333;
            max-width: 92vw;
        }

        .tren-icono {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid white;
            text-align: center;
            line-height: 30px;
            font-size: 17px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
        }

        .leaflet-popup-content {
            font-size: 12px;
            line-height: 1.6;
            min-width: 195px;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 7px;
        }

        #cuentaatras {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1000;
            padding: 0 14px;
            height: 58px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(0, 12, 0, 0.88);
            border: 1px solid #00ff41;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.6), inset 0 0 8px rgba(0, 255, 65, 0.15);
            color: #00ff41;
            font-family: "Courier New", Consolas, monospace;
            text-align: center;
            text-shadow: 0 0 6px #00ff41;
            pointer-events: none;
        }
        #cuentaatras .rotulo {
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: bold;
        }
        #cuentaatras .digitos {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 3px;
            line-height: 1.15;
            font-variant-numeric: tabular-nums;
        }

        #titulo {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            height: 58px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            padding: 0 22px;
            background: rgba(0, 12, 0, 0.88);
            border: 1px solid #00ff41;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.6), inset 0 0 8px rgba(0, 255, 65, 0.15);
            color: #00ff41;
            font-family: "Courier New", Consolas, monospace;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 4px;
            white-space: nowrap;
            text-shadow: 0 0 8px #00ff41, 0 0 16px rgba(0, 255, 65, 0.5);
            pointer-events: none;
        }
        @media (max-width: 800px) {
            #titulo { top: 78px; font-size: 13px; letter-spacing: 2px; height: 36px; padding: 0 12px; }
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="titulo">RADAR DE TRENES EN ASTURIAS</div>
<div id="cuentaatras"><div class="rotulo">SE ACTUALIZA EN:</div><div class="digitos" id="cuentaDigitos">00:00</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// =====================================================
// 1. CONFIGURACIÓN
// =====================================================

// Solo hace falta rellenar esto si la web NO está en GitHub Pages
// (si está en usuario.github.io/repositorio se detecta solo).
let GITHUB_USER = "javi1899";
let GITHUB_REPO = "radar-trenes-asturias";
// Rama donde el workflow publica los datos (se sobrescribe cada minuto, sin historial)
const RAMA = "datos";

if (!GITHUB_USER && location.hostname.endsWith(".github.io")) {
    GITHUB_USER = location.hostname.split(".")[0];
    GITHUB_REPO = location.pathname.split("/")[1] || "";
}

const INTERVALO_MS = 60000;      // cada cuánto se relee el archivo de datos
const TIMEOUT_MS = 15000;
const POSICION_ANTIGUA_S = 600;  // 10 min entre la posición y la descarga
const DATOS_VIEJOS_MIN = 30;     // aviso si el archivo de datos tiene más de 30 min

const marcadoresTrenes = {};
let cargando = false;

// =====================================================
// 2. MAPA
// =====================================================

const map = L.map('map').setView([43.36, -5.85], 9);

L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: 'Tiles &copy; Esri' }
).addTo(map);

const controlEstado = L.control({ position: 'bottomleft' });
controlEstado.onAdd = function () {
    const div = L.DomUtil.create('div');
    div.id = 'estado';
    div.innerText = 'Cargando trenes...';
    return div;
};
controlEstado.addTo(map);

function mostrarEstado(m) {
    const el = document.getElementById('estado');
    if (el) el.innerText = m;
}

function escapar(texto) {
    return String(texto == null ? '' : texto)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

const pad = (n) => String(n).padStart(2, '0');

function formatearFecha(unixSegundos) {
    const d = new Date(unixSegundos * 1000);
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ` +
           `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function formatearHora(unixSegundos) {
    const d = unixSegundos ? new Date(unixSegundos * 1000) : new Date();
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

// =====================================================
// 3. DESCARGA DEL ARCHIVO DE DATOS
// =====================================================

function construirFuentes() {
    const minuto = Math.floor(Date.now() / 60000);
    const fuentes = [];

    // Versión más fresca: directamente desde el repositorio
    if (GITHUB_USER && GITHUB_REPO) {
        fuentes.push({
            nombre: "github",
            url: `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${RAMA}/data/trenes.json?t=${minuto}`
        });
    }

    // Copia servida por la propia web
    fuentes.push({ nombre: "web", url: `data/trenes.json?t=${minuto}` });
    return fuentes;
}

async function descargarUna(fuente) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
        const resp = await fetch(fuente.url, { signal: ctrl.signal, cache: "no-store" });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const json = JSON.parse(await resp.text());
        if (!json || !Array.isArray(json.posiciones)) throw new Error("formato inesperado");
        return json;
    } catch (e) {
        const msg = e.name === "AbortError" ? "tiempo agotado" : (e.message || String(e));
        throw new Error(`${fuente.nombre}: ${msg}`);
    } finally {
        clearTimeout(timer);
    }
}

async function descargarDatos() {
    const resultados = await Promise.allSettled(construirFuentes().map(descargarUna));
    const buenos = resultados.filter(r => r.status === "fulfilled").map(r => r.value);

    if (buenos.length === 0) {
        throw new Error(resultados.map(r => r.reason.message).join(" | "));
    }

    // Nos quedamos con el más reciente
    buenos.sort((a, b) => (b.fetchedAt || 0) - (a.fetchedAt || 0));
    return buenos[0];
}

// =====================================================
// 4. MARCADORES
// =====================================================

function crearIconoTren(color) {
    return L.divIcon({
        className: '',
        html: `<div class="tren-icono" style="background:${color}">🚆</div>`,
        iconSize: [34, 34],
        iconAnchor: [17, 17]
    });
}

function actualizarTren(t, retrasoMinutos, edadSegundos, posicionAntigua) {
    let estadoTexto = '';
    let color = '#1976D2';

    if (posicionAntigua) {
        estadoTexto = '⚠️ Posición antigua';
        color = '#777777';
    } else if (retrasoMinutos === null) {
        estadoTexto = '⚪ Retraso no disponible';
    } else if (retrasoMinutos > 0) {
        estadoTexto = `🔴 Retraso: +${retrasoMinutos} min`;
        color = retrasoMinutos > 5 ? '#E53935' : '#FB8C00';
    } else if (retrasoMinutos < 0) {
        estadoTexto = `🟢 Adelantado: ${Math.abs(retrasoMinutos)} min`;
        color = '#2E9D50';
    } else {
        estadoTexto = '🟢 En hora';
        color = '#2E9D50';
    }

    const nombre = t.etiqueta || t.rutaId || t.id;
    const edadTexto = edadSegundos !== null ? `${edadSegundos} segundos` : 'No disponible';
    const fechaPos = t.timestamp > 0 ? formatearFecha(t.timestamp) : 'No disponible';

    const contenido =
        `<b>🚆 ${escapar(nombre)}</b><hr>` +
        `<b>Estado:</b> ${estadoTexto}<br>` +
        `<b>Latitud:</b> ${t.lat.toFixed(6)}<br>` +
        `<b>Longitud:</b> ${t.lon.toFixed(6)}<br>` +
        `<b>Antigüedad al descargar:</b> ${edadTexto}<br>` +
        `<b>Última posición:</b> ${escapar(fechaPos)}<br>` +
        `<b>Ruta:</b> ${escapar(t.rutaId || 'No disponible')}<br>` +
        `<b>Viaje:</b> ${escapar(t.viajeId || 'No disponible')}`;

    if (marcadoresTrenes[t.id]) {
        marcadoresTrenes[t.id].setLatLng([t.lat, t.lon]);
        marcadoresTrenes[t.id].setIcon(crearIconoTren(color));
        marcadoresTrenes[t.id].setPopupContent(contenido);
    } else {
        const marker = L.marker([t.lat, t.lon], { icon: crearIconoTren(color) }).addTo(map);
        marker.bindPopup(contenido);
        marcadoresTrenes[t.id] = marker;
    }
}

function eliminarAusentes(idsVigentes) {
    for (const id in marcadoresTrenes) {
        if (!idsVigentes.has(id)) {
            map.removeLayer(marcadoresTrenes[id]);
            delete marcadoresTrenes[id];
        }
    }
}

// =====================================================
// 5. BUCLE PRINCIPAL
// =====================================================

async function actualizar() {
    if (cargando) return;
    cargando = true;
    proximaAct = Date.now() + INTERVALO_MS;

    try {
        const datos = await descargarDatos();

        if (!datos.fetchedAt) {
            mostrarEstado("Aún no hay datos: en GitHub, pestaña Actions → «Actualizar datos Renfe» → Run workflow.");
            return;
        }

        const idsVigentes = new Set();
        let antiguos = 0;

        for (const t of datos.posiciones) {
            const edad = t.timestamp > 0 ? Math.max(0, datos.fetchedAt - t.timestamp) : null;
            const antigua = edad !== null && edad > POSICION_ANTIGUA_S;
            if (antigua) antiguos++;

            const seg = t.viajeId ? datos.retrasos?.[t.viajeId] : undefined;
            const retraso = (seg === undefined || seg === null) ? null : Math.round(seg / 60);

            idsVigentes.add(t.id);
            actualizarTren(t, retraso, edad, antigua);
        }

        eliminarAusentes(idsVigentes);

        const minutos = Math.round((Date.now() / 1000 - datos.fetchedAt) / 60);
        const aviso = minutos > DATOS_VIEJOS_MIN ? " ⚠️ DATOS ANTIGUOS" : "";

        document.title = `Radar Trenes Asturias - ${idsVigentes.size} trenes`;
        mostrarEstado(
            `Trenes: ${idsVigentes.size} | Antiguas: ${antiguos} | ` +
            `Datos de ${formatearHora(datos.fetchedAt)} (hace ${minutos} min)${aviso}`
        );
    } catch (err) {
        console.error("Error cargando datos:", err);
        const hay = Object.keys(marcadoresTrenes).length > 0;
        mostrarEstado(hay
            ? `Aviso: ${err.message} — mostrando últimos datos, reintentando...`
            : `Error: ${err.message}`);
    } finally {
        cargando = false;
    }
}

let proximaAct = Date.now() + INTERVALO_MS;
function pintarCuenta() {
    const r = Math.max(0, Math.ceil((proximaAct - Date.now()) / 1000));
    const m = String(Math.floor(r / 60)).padStart(2, "0");
    const sg = String(r % 60).padStart(2, "0");
    document.getElementById("cuentaDigitos").textContent = `${m}:${sg}`;
}
setInterval(pintarCuenta, 250);

actualizar();
setInterval(() => { if (!document.hidden) actualizar(); }, INTERVALO_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) actualizar(); });
</script>

</body>
</html>
