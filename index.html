<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radar Ferroviario de Asturias</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #estado {
            background: white;
            padding: 9px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            font-size: 12px;
            font-weight: bold;
            color: #333;
            max-width: 92vw;
        }

        .tren-icono {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid white;
            text-align: center;
            line-height: 30px;
            font-size: 17px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
        }

        .leaflet-popup-content {
            font-size: 12px;
            line-height: 1.6;
            min-width: 195px;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 7px;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// =====================================================
// 1. CONFIGURACIÓN
// =====================================================

const WORKER_URL = "https://morning-salad-4534.tuerojuncojavier2.workers.dev";

// Feeds oficiales GTFS-Realtime JSON de Renfe
const URL_POSICIONES    = "https://gtfsrt.renfe.com/vehicle_positions.json";
const URL_RETRASOS      = "https://gtfsrt.renfe.com/trip_updates.json";
const URL_POSICIONES_LD = "https://gtfsrt.renfe.com/vehicle_positions_LD.json";
const URL_RETRASOS_LD   = "https://gtfsrt.renfe.com/trip_updates_LD.json";

// Rectángulo geográfico de Asturias
const LAT_MIN = 42.70;
const LAT_MAX = 43.85;
const LON_MIN = -7.30;
const LON_MAX = -4.30;

// Refresco cada 30 segundos (evita bloqueos por exceso de peticiones en Renfe)
const INTERVALO_MS = 30000;
const TIMEOUT_DESCARGA_MS = 20000;

let actualizando = false;
const marcadoresTrenes = {};

// =====================================================
// 2. INICIALIZACIÓN DEL MAPA LEAFLET
// =====================================================

const map = L.map('map').setView([43.36, -5.85], 9);

L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri'
    }
).addTo(map);

const controlEstado = L.control({ position: 'bottomleft' });

controlEstado.onAdd = function () {
    const div = L.DomUtil.create('div');
    div.id = 'estado';
    div.innerText = 'Iniciando radar ferroviario...';
    return div;
};

controlEstado.addTo(map);

function mostrarEstado(mensaje) {
    const el = document.getElementById('estado');
    if (el) el.innerText = mensaje;
}

function escapar(texto) {
    return String(texto == null ? '' : texto)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function formatearFechaLocal(unixSegundos) {
    const d = new Date(unixSegundos * 1000);
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ` +
           `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function formatearHoraActual() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

// =====================================================
// 3. DESCARGA CON MÚLTIPLES RUTAS DE RESPALDO
// =====================================================

function construirRutas(urlRenfe) {
    const baseWorker = WORKER_URL.replace(/\/+$/, "");
    const encoded = encodeURIComponent(urlRenfe);
    return [
        `${baseWorker}/?url=${encoded}`,
        `https://api.allorigins.win/raw?url=${encoded}`,
        `https://api.codetabs.com/v1/proxy?quest=${encoded}`,
        urlRenfe
    ];
}

async function descargarJsonRenfe(urlRenfe) {
    const rutas = construirRutas(urlRenfe);
    let ultimoError = "Sin respuesta";

    for (const destino of rutas) {
        const controlador = new AbortController();
        const timeout = setTimeout(() => controlador.abort(), TIMEOUT_DESCARGA_MS);

        try {
            const resp = await fetch(destino, {
                signal: controlador.signal,
                cache: "no-store"
            });

            if (!resp.ok) {
                throw new Error(`HTTP ${resp.status}`);
            }

            const texto = await resp.text();
            const limpio = texto.trim();

            if (!limpio) {
                throw new Error("Respuesta vacía");
            }

            if (limpio.startsWith("<")) {
                const matchTitulo = limpio.match(/<title[^>]*>([^<]+)<\/title>/i);
                const motivo = matchTitulo ? matchTitulo[1].trim() : "HTML inesperado";
                throw new Error(`Bloqueo/HTML (${motivo})`);
            }

            return JSON.parse(limpio);
        } catch (e) {
            if (e.name === "AbortError") {
                ultimoError = "Tiempo agotado esperando a Renfe";
            } else {
                ultimoError = e.message || String(e);
            }
        } finally {
            clearTimeout(timeout);
        }
    }

    throw new Error(ultimoError);
}

// =====================================================
// 4. EXTRACCIÓN DE POSICIONES Y RETRASOS
// =====================================================

function extraerPosiciones(feedJson) {
    const lista = [];
    const entidades = feedJson?.entity || [];

    for (const ent of entidades) {
        const veh = ent?.vehicle;
        if (!veh || !veh.position) continue;

        const lat = Number(veh.position.latitude);
        const lon = Number(veh.position.longitude);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;

        const trip = veh.trip || {};
        const desc = veh.vehicle || {};

        lista.push({
            entidadId:  String(ent.id ?? ""),
            vehiculoId: String(desc.id ?? ""),
            etiqueta:   String(desc.label ?? ""),
            viajeId:    String(trip.tripId ?? trip.trip_id ?? ""),
            rutaId:     String(trip.routeId ?? trip.route_id ?? ""),
            lat,
            lon,
            timestamp:  Number(veh.timestamp ?? 0)
        });
    }

    return lista;
}

function extraerRetrasos(feedJson) {
    const mapa = new Map();
    const entidades = feedJson?.entity || [];

    for (const ent of entidades) {
        const tu = ent?.tripUpdate || ent?.trip_update;
        if (!tu) continue;

        const trip = tu.trip || {};
        const viajeId = String(trip.tripId ?? trip.trip_id ?? "");
        if (!viajeId) continue;

        let retrasoSeg = tu.delay != null ? Number(tu.delay) : null;

        if (retrasoSeg === null || !Number.isFinite(retrasoSeg)) {
            const paradas = tu.stopTimeUpdate || tu.stop_time_update || [];
            for (const stu of paradas) {
                const arrDelay = stu?.arrival?.delay;
                const depDelay = stu?.departure?.delay;
                if (arrDelay != null && Number.isFinite(Number(arrDelay))) {
                    retrasoSeg = Number(arrDelay);
                    break;
                }
                if (depDelay != null && Number.isFinite(Number(depDelay))) {
                    retrasoSeg = Number(depDelay);
                    break;
                }
            }
        }

        if (retrasoSeg !== null && Number.isFinite(retrasoSeg)) {
            mapa.set(viajeId, retrasoSeg);
        }
    }

    return mapa;
}

// =====================================================
// 5. PINTADO DE MARCADORES EN EL MAPA
// =====================================================

function crearIconoTren(color) {
    return L.divIcon({
        className: '',
        html: `<div class="tren-icono" style="background:${color}">🚆</div>`,
        iconSize: [34, 34],
        iconAnchor: [17, 17]
    });
}

function actualizarTren(
    id, lat, lon, nombre, retrasoMinutos,
    fechaPosicion, edadSegundos, rutaId, viajeId, posicionAntigua
) {
    let estadoTexto = '';
    let color = '#1976D2';

    if (posicionAntigua) {
        estadoTexto = '⚠️ Posición antigua';
        color = '#777777';
    } else if (retrasoMinutos === null) {
        estadoTexto = '⚪ Retraso no disponible';
        color = '#1976D2';
    } else if (retrasoMinutos > 0) {
        estadoTexto = `🔴 Retraso: +${retrasoMinutos} min`;
        color = retrasoMinutos > 5 ? '#E53935' : '#FB8C00';
    } else if (retrasoMinutos < 0) {
        estadoTexto = `🟢 Adelantado: ${Math.abs(retrasoMinutos)} min`;
        color = '#2E9D50';
    } else {
        estadoTexto = '🟢 En hora';
        color = '#2E9D50';
    }

    const edadTexto = edadSegundos !== null ? `${edadSegundos} segundos` : 'No disponible';

    const contenido =
        `<b>🚆 ${escapar(nombre)}</b><hr>` +
        `<b>Estado:</b> ${estadoTexto}<br>` +
        `<b>Latitud:</b> ${lat.toFixed(6)}<br>` +
        `<b>Longitud:</b> ${lon.toFixed(6)}<br>` +
        `<b>Antigüedad:</b> ${edadTexto}<br>` +
        `<b>Última posición:</b> ${escapar(fechaPosicion)}<br>` +
        `<b>Ruta:</b> ${escapar(rutaId || 'No disponible')}<br>` +
        `<b>Viaje:</b> ${escapar(viajeId || 'No disponible')}`;

    if (marcadoresTrenes[id]) {
        marcadoresTrenes[id].setLatLng([lat, lon]);
        marcadoresTrenes[id].setIcon(crearIconoTren(color));
        marcadoresTrenes[id].setPopupContent(contenido);
    } else {
        const marker = L.marker([lat, lon], { icon: crearIconoTren(color) }).addTo(map);
        marker.bindPopup(contenido);
        marcadoresTrenes[id] = marker;
    }
}

function eliminarAusentes(idsVigentesSet) {
    for (const id in marcadoresTrenes) {
        if (!idsVigentesSet.has(id)) {
            map.removeLayer(marcadoresTrenes[id]);
            delete marcadoresTrenes[id];
        }
    }
}

// =====================================================
// 6. BUCLE PRINCIPAL DE ACTUALIZACIÓN
// =====================================================

async function actualizarTrenesReales() {
    if (actualizando) return;
    actualizando = true;

    try {
        const [resPos, resPosLD] = await Promise.allSettled([
            descargarJsonRenfe(URL_POSICIONES),
            descargarJsonRenfe(URL_POSICIONES_LD)
        ]);

        if (resPos.status !== "fulfilled" && resPosLD.status !== "fulfilled") {
            const motivo = resPos.reason?.message || resPosLD.reason?.message || "Sin respuesta";
            throw new Error(motivo);
        }

        const [resRet, resRetLD] = await Promise.allSettled([
            descargarJsonRenfe(URL_RETRASOS),
            descargarJsonRenfe(URL_RETRASOS_LD)
        ]);

        const retrasosPorViaje = new Map();

        if (resRet.status === "fulfilled") {
            for (const [k, v] of extraerRetrasos(resRet.value)) {
                retrasosPorViaje.set(k, v);
            }
        }
        if (resRetLD.status === "fulfilled") {
            for (const [k, v] of extraerRetrasos(resRetLD.value)) {
                retrasosPorViaje.set(k, v);
            }
        }

        const todos = [];
        if (resPos.status === "fulfilled") {
            todos.push(...extraerPosiciones(resPos.value));
        }
        if (resPosLD.status === "fulfilled") {
            const trenesLD = extraerPosiciones(resPosLD.value);
            for (const tld of trenesLD) {
                if (tld.vehiculoId) tld.vehiculoId = "LD-" + tld.vehiculoId;
                if (tld.entidadId) tld.entidadId = "LD-" + tld.entidadId;
            }
            todos.push(...trenesLD);
        }

        const idsVigentes = new Set();
        const posicionesDistintas = new Set();
        let trenesAntiguos = 0;
        const ahora = Math.floor(Date.now() / 1000);

        for (const t of todos) {
            if (t.lat < LAT_MIN || t.lat > LAT_MAX || t.lon < LON_MIN || t.lon > LON_MAX) {
                continue;
            }

            const id = t.vehiculoId || t.entidadId;
            if (!id) continue;

            const nombre = t.etiqueta || t.rutaId || id;

            let edadSegundos = null;
            let fechaPosicion = "No disponible";
            let posicionAntigua = false;

            if (t.timestamp > 0) {
                edadSegundos = Math.max(0, ahora - t.timestamp);
                fechaPosicion = formatearFechaLocal(t.timestamp);
                posicionAntigua = edadSegundos > 120;
                if (posicionAntigua) trenesAntiguos++;
            }

            let retrasoMinutos = null;
            if (t.viajeId && retrasosPorViaje.has(t.viajeId)) {
                retrasoMinutos = Math.round(retrasosPorViaje.get(t.viajeId) / 60);
            }

            posicionesDistintas.add(`${t.lat.toFixed(4)},${t.lon.toFixed(4)}`);
            idsVigentes.add(id);

            actualizarTren(
                id, t.lat, t.lon, nombre, retrasoMinutos,
                fechaPosicion, edadSegundos, t.rutaId, t.viajeId, posicionAntigua
            );
        }

        eliminarAusentes(idsVigentes);

        const horaActual = formatearHoraActual();
        const avisoRetrasos = (resRet.status !== "fulfilled" && resRetLD.status !== "fulfilled")
            ? " (sin retrasos)" : "";

        document.title = `Radar Trenes Asturias - ${idsVigentes.size} trenes - ${horaActual}`;
        mostrarEstado(
            `Trenes: ${idsVigentes.size} | Posiciones: ${posicionesDistintas.size} | ` +
            `Antiguas: ${trenesAntiguos}${avisoRetrasos} | Actualizado: ${horaActual}`
        );
    } catch (err) {
        console.error("Error actualizando radar:", err);
        const hayTrenesEnMapa = Object.keys(marcadoresTrenes).length > 0;
        if (hayTrenesEnMapa) {
            mostrarEstado(`Aviso (${formatearHoraActual()}): ${err.message} — Reintentando...`);
        } else {
            document.title = "Radar Trenes Asturias - Error de conexión";
            mostrarEstado("Error de conexión: " + err.message);
        }
    } finally {
        actualizando = false;
    }
}

actualizarTrenesReales();
setInterval(actualizarTrenesReales, INTERVALO_MS);
</script>

</body>
</html>
