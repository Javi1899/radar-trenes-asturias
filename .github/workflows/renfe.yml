name: Actualizar datos Renfe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renfe-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cada ejecución (cron de 5 min) descarga y publica 5 veces, una por minuto.
      # Los datos se publican en la rama "datos" (un solo commit que se sobrescribe),
      # así no se llena el historial ni se reconstruye Pages cada minuto.
      - name: Descargar y publicar cada minuto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3 4 5; do
            inicio=$(date +%s)
            if node scripts/fetch-renfe.js; then
              rm -rf /tmp/datos && mkdir -p /tmp/datos/data
              cp data/trenes.json /tmp/datos/data/trenes.json
              (
                cd /tmp/datos
                git init -q -b datos
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add -A
                git commit -q -m "Datos Renfe $(date -u +%H:%M:%S) UTC"
                git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" datos
              ) || echo "No se pudo publicar esta vez"
            else
              echo "Descarga fallida, se reintenta en el siguiente ciclo"
            fi
            [ "$i" -lt 5 ] || break
            resto=$(( 60 - ($(date +%s) - inicio) ))
            [ "$resto" -gt 0 ] && sleep "$resto"
          done
