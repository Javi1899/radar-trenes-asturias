name: Actualizar datos Renfe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renfe-datos
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar feeds de Renfe
        run: node scripts/fetch-renfe.js

      - name: Guardar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trenes.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos Renfe $(date -u +%H:%M) UTC"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
